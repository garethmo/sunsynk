    - name: "Sunsynk Overall State"
      unique_id: sunsynkgm_overall_state
      state_topic: "sunsynkgm/overall_state"
      icon: mdi:information-outline

  binary_sensor:
    - name: "Sunsynk Grid Connected"
      unique_id: sunsynkgm_grid_connected
      state_topic: "sunsynkgm/grid_connected"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: connectivity
