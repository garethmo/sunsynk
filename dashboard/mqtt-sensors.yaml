    - name: "Sunsynk Day Grid Import"
      unique_id: sunsynkgm_day_grid_import
      state_topic: "sunsynkgm/day_grid_import"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Sunsynk Day Grid Export"
      unique_id: sunsynkgm_day_grid_export
      state_topic: "sunsynkgm/day_grid_export"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Sunsynk Total Grid Import"
      unique_id: sunsynkgm_total_grid_import
      state_topic: "sunsynkgm/total_grid_import"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Sunsynk Total Grid Export"
      unique_id: sunsynkgm_total_grid_export
      state_topic: "sunsynkgm/total_grid_export"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # --- Load & Inverter Sensors ---
    - name: "Sunsynk Load Power"
      unique_id: sunsynkgm_load_power
      state_topic: "sunsynkgm/load_power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:home-lightning-bolt

    - name: "Sunsynk Essential Power"
      unique_id: sunsynkgm_essential_power
      state_topic: "sunsynkgm/essential_power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "Sunsynk Non-Essential Power"
      unique_id: sunsynkgm_non_essential_power
      state_topic: "sunsynkgm/non_essential_power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "Sunsynk Aux Power"
      unique_id: sunsynkgm_aux_power
      state_topic: "sunsynkgm/aux_power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "Sunsynk Day Load Energy"
      unique_id: sunsynkgm_day_load_energy
      state_topic: "sunsynkgm/day_load_energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Sunsynk Inverter Power"
      unique_id: sunsynkgm_inverter_power
